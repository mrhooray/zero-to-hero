<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
<title id="title">DeepSeek V4 Flash 0731 decode performance</title>
<desc id="desc">Client-observed decode frontier for Infer, TokenSpeed, SGLang, and Infer with DSpark across a C4 to C128 concurrency sweep. Output tokens per second per user are plotted against output tokens per second per GPU.</desc>
<style>
  .background { fill: #ffffff; }
  text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #20262e; }
  .muted { fill: #66717e; }
  .grid { stroke: #dce2e8; stroke-width: 1; }
  .frame { stroke: #7b8794; stroke-width: 1; fill: none; }
  .tick { font-size: 11px; }
  .point-label { font-size: 11px; font-weight: 500; }
  .axis-title, .legend { font-size: 12px; }
  .method-note { font-size: 12px; }
  .title { font-size: 19px; font-weight: 600; }
  .subtitle { font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    .background { fill: #11151a; }
    text { fill: #edf2f7; }
    .muted { fill: #a6b0bb; }
    .grid { stroke: #323a43; }
    .frame { stroke: #687583; }
  }
</style>
<rect class="background" width="720" height="400"/>
<text class="title" x="90" y="28">DeepSeek V4 Flash 0731 decode performance</text>
<text class="subtitle muted" x="90" y="52">4×B200 · DP4+EP4 · 8,192-token prefix hit · C4–C128 sweep</text>
<text class="method-note muted" x="90" y="70">DP+DSpark not fully supported in TokenSpeed/SGLang at test time · comparator curves use target model only</text>

<line x1="90" x2="110" y1="94" y2="94" stroke="#4299e1" stroke-width="2.5"/>
<text class="legend" x="117" y="98">Infer</text>
<line x1="180" x2="200" y1="94" y2="94" stroke="#ed8936" stroke-width="2.5" stroke-dasharray="7 5"/>
<text class="legend" x="207" y="98">TokenSpeed</text>
<line x1="310" x2="330" y1="94" y2="94" stroke="#48bb78" stroke-width="2.5" stroke-dasharray="7 5"/>
<text class="legend" x="337" y="98">SGLang</text>
<line x1="415" x2="435" y1="94" y2="94" stroke="#9f7aea" stroke-width="2.5"/>
<text class="legend" x="442" y="98">Infer + DSpark</text>

<line class="grid" x1="90.00" x2="90.00" y1="120" y2="342"/>
