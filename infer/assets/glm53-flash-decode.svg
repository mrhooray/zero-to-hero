<text class="tick muted" x="81" y="179.50" text-anchor="end">1.5k</text>
<line class="grid" x1="90" x2="700" y1="120.00" y2="120.00"/>
<text class="tick muted" x="81" y="124.00" text-anchor="end">2k</text>
<rect class="frame" x="90" y="120" width="610" height="222"/>

<path d="M354.08,332.72 L334.76,307.64 L295.07,226.90 L247.96,165.82" fill="none" stroke="#4299e1" stroke-width="2.5"/>
