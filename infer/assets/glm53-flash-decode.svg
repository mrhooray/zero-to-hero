<text class="tick muted" x="700.00" y="361" text-anchor="middle">200</text>
<line class="grid" x1="90" x2="700" y1="342.00" y2="342.00"/>
<text class="tick muted" x="81" y="346.00" text-anchor="end">0</text>
<line class="grid" x1="90" x2="700" y1="286.50" y2="286.50"/>
<text class="tick muted" x="81" y="290.50" text-anchor="end">500</text>
<line class="grid" x1="90" x2="700" y1="231.00" y2="231.00"/>
<text class="tick muted" x="81" y="235.00" text-anchor="end">1k</text>
